<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Eagle Emergency Security | Dashibodi</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F8;--card:#fff;--tx:#14173A;--dim:#585D78;--line:#DDE0EA;--ac:#F6993F;--nav:#101437;--navtx:#E7E9F5;--okb:#DDF3E6;--okt:#14653B;--wb:#FFF0D9;--wt:#8A4B00;--bb:#FBE0DE;--bt:#9B1C14;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0B0D26;--card:#151A45;--tx:#ECEEF9;--dim:#A9AFCB;--line:#2A3066;--nav:#070919;--okb:#12382A;--okt:#7FE0A8;--wb:#43300F;--wt:#FFC77A;--bb:#4A1A18;--bt:#FFA9A2;color-scheme:dark}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--nav);color:var(--navtx);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column}
aside h1{font-size:15px;margin:0 8px 4px;letter-spacing:.5px}
aside small{display:block;margin:0 8px 20px;color:var(--ac);font-weight:600}
aside a{display:block;padding:12px 14px;color:var(--navtx);text-decoration:none;font-weight:600;min-height:44px;border-left:3px solid transparent}
aside a.on{background:rgba(246,153,63,.16);border-color:var(--ac);color:#fff}
aside a:hover{background:rgba(255,255,255,.07)}
.me{margin-top:auto;padding:12px 8px;font-size:13px;color:#B9BEDB}
.me button{margin-top:8px;background:none;border:1px solid #394075;color:var(--navtx);padding:8px 14px;cursor:pointer;min-height:44px}
main{padding:28px;min-width:0}
h2{font-size:26px;margin:0 0 20px}
h3{font-size:16px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--line);padding:18px;min-width:0}
.k b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.k span{color:var(--dim);font-size:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--dim)}
.bars i{display:block;background:var(--ac);margin-bottom:6px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-size:13px;font-weight:600}
.p{display:inline-block;padding:3px 10px;font-size:13px;font-weight:600}
.ok{background:var(--okb);color:var(--okt)}.wn{background:var(--wb);color:var(--wt)}.bd{background:var(--bb);color:var(--bt)}
button,input,select{font:inherit;color:inherit}
.b{background:var(--ac);color:#101437;border:0;padding:10px 18px;font-weight:800;cursor:pointer;min-height:44px}
.b2{background:none;border:1px solid var(--line);padding:8px 12px;cursor:pointer;min-height:44px;color:var(--tx)}
.b2.on{background:var(--ac);color:#101437;border-color:var(--ac);font-weight:800}
input,select{background:var(--bg);border:1px solid var(--line);padding:10px;min-height:44px;width:100%}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;align-items:center}
.bar input{max-width:280px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.f label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.msg{padding:10px 14px;margin-bottom:16px;font-weight:600}
.msg.e{background:var(--bb);color:var(--bt)}.msg.o{background:var(--okb);color:var(--okt)}
.login{max-width:400px;margin:12vh auto;padding:28px}
.login .f{grid-template-columns:1fr}
.empty{color:var(--dim);padding:16px 0}
.sheet{background:#fff;color:#111;padding:32px;border:1px solid #ccc;max-width:860px;margin:0 auto;font-size:14px;line-height:1.5}
.sheet table{min-width:0}
.sheet th{color:#444;border-bottom:2px solid #111;white-space:normal}
.sheet td{border-bottom:1px solid #ddd;white-space:normal;color:#111}
.sheet h4{margin:18px 0 6px}
.sheet .tot{margin-left:auto;width:300px;max-width:100%}
.sheet .tot td{border:0;padding:4px 0}
.sig{display:flex;gap:40px;margin-top:48px}.sig div{flex:1;border-top:1px solid #111;padding-top:6px}
@media print{aside,.noprint,#msg,body::before{display:none!important}body{background:#fff;padding:0}.app{display:block}main{padding:0}.sheet{border:0;padding:0;max-width:none}}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;z-index:5}
aside h1,aside small,.me span{display:none}
aside a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
aside a.on{border-color:var(--ac)}
.me{margin:0 0 0 auto;padding:0}
.me button{margin:0}
main{padding:18px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
const cfg=window.EAGLE_CONFIG||{},root=document.getElementById('root');
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const fm=n=>'TSh '+Number(n||0).toLocaleString('en-US');
const pill=(t,c)=>'<span class="p '+c+'">'+esc(t)+'</span>';
if(!cfg.url||/PASTE/.test(cfg.url)||!window.supabase){root.innerHTML='<div class="login c"><h2>Dashibodi haijaunganishwa</h2><p>Weka anwani ya Supabase na ufunguo wa umma (anon) kwenye faili <b>config.js</b>, kisha pakia ukurasa upya.</p></div>';return}
const sb=supabase.createClient(cfg.url,cfg.key);
const S={uid:null,role:null,name:'',guards:[],clients:[],contracts:[],docs:[],items:[],moves:[],set:{company:{},banks:[],mobile:[]},df:null,docv:null,att:[],date:today(),q:'',form:null,msg:null,view:'muhtasari'};
const isA=()=>S.role==='admin';
const NAV=[['muhtasari','Muhtasari'],['walinzi','Walinzi'],['mikataba','Wateja na Mikataba',1],['mahudhurio','Mahudhurio'],['nukuu','Nukuu za Bei',1],['ankara','Ankara',1],['hati','Hati za Kukabidhi',1],['risiti','Risiti',1],['stoo','Stoo',1],['mipangilio','Mipangilio',1]];
const DT={quotation:{p:'QT',n:'Nukuu ya Bei',pl:'Nukuu za Bei'},invoice:{p:'INV',n:'Ankara',pl:'Ankara'},delivery_note:{p:'DN',n:'Hati ya Kukabidhi',pl:'Hati za Kukabidhi'},receipt:{p:'RCT',n:'Risiti',pl:'Risiti'}};
const PM=['Pesa taslimu','Benki','M-Pesa','Tigo Pesa','Airtel Money','HaloPesa'];
const cname=id=>{const c=S.clients.find(x=>x.id===id);return c?c.name:'Hakuna kituo'};
const ctr=id=>S.contracts.find(x=>x.client_id===id)||{};
const activeG=()=>S.guards.filter(g=>g.status==='Kazini');
const attOn=d=>{const m={};S.att.filter(a=>a.work_date===d).forEach(a=>m[a.guard_id]=a.status);return m};
const rateOn=d=>{const m=attOn(d),a=activeG(),n=a.filter(g=>m[g.id]).length;if(!n)return null;return Math.round(a.filter(g=>m[g.id]&&m[g.id]!=='A').length*100/a.length)};
const cst=e=>!e?pill('Hakuna tarehe','wn'):e<today()?pill('Imeisha','bd'):e<addDays(today(),60)?pill('Inaisha karibu','wn'):pill('Hai','ok');
const dleft=e=>Math.round((new Date(e+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
function note(t,k){S.msg={t:t,k:k||'e'}}
async function loadAll(){
 const d6=addDays(today(),-6),from=S.date<d6?S.date:d6,off={data:[],error:null},A=isA();
 const r=await Promise.all([sb.from('guards').select('*').order('code'),sb.from('clients').select('*').order('name'),sb.from('attendance').select('guard_id,work_date,status').gte('work_date',from).lte('work_date',today()),A?sb.from('contracts').select('*'):off,A?sb.from('documents').select('*').order('created_at'):off,A?sb.from('stock_items').select('*').order('name'):off,A?sb.from('stock_moves').select('*').order('move_date',{ascending:false}):off,A?sb.from('settings').select('*').eq('id',1).maybeSingle():{data:null,error:null}]);
 r.forEach(x=>{if(x.error)throw x.error});
 S.guards=r[0].data;S.clients=r[1].data;S.att=r[2].data;S.contracts=r[3].data;S.docs=r[4].data;S.items=r[5].data;S.moves=r[6].data;
 if(r[7].data)S.set={company:r[7].data.company||{},banks:r[7].data.banks||[],mobile:r[7].data.mobile||[]};
}
function loginView(m){
 root.innerHTML='<div class="login c"><h2>Dashibodi ya Eagle</h2><p style="color:var(--dim)">Ingia kwa barua pepe na nenosiri ulilopewa.</p>'+(m?'<div class="msg e">'+esc(m)+'</div>':'')+'<form id="lf" class="f"><div><label for="em">Barua pepe</label><input id="em" type="email" autocomplete="username" required></div><div><label for="pw">Nenosiri</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="b" type="submit">Ingia</button></form><p style="color:var(--dim);font-size:13px">Akaunti mpya zinatengenezwa na msimamizi mkuu pekee.</p></div>';
 document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});if(r.error)loginView('Barua pepe au nenosiri si sahihi.');else boot()});
}
async function boot(){
 const s=(await sb.auth.getSession()).data.session;if(!s){loginView();return}
 S.uid=s.user.id;
 const p=await sb.from('profiles').select('full_name,role').eq('id',S.uid).maybeSingle();
 if(!p.data){root.innerHTML='<div class="login c"><h2>Akaunti haijaidhinishwa</h2><p>Akaunti yako haina ruhusa bado. Mwombe msimamizi mkuu akupe jukumu.</p><button class="b" id="lo">Toka</button></div>';document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();boot()};return}
 S.role=p.data.role;S.name=p.data.full_name||s.user.email;
 try{await loadAll()}catch(e){note('Imeshindwa kupakia data: '+e.message)}
 shell();route();
}
function shell(){
 root.innerHTML='<div class="app"><aside><h1>EAGLE EMERGENCY SECURITY</h1><small>Dashibodi ya Usimamizi</small>'+NAV.filter(n=>!n[2]||isA()).map(n=>'<a href="#'+n[0]+'" data-v="'+n[0]+'">'+n[1]+'</a>').join('')+'<div class="me"><span>'+esc(S.name)+' ('+(isA()?'Msimamizi mkuu':'Msimamizi wa kituo')+')</span><br><button id="lo">Toka</button></div></aside><main><div id="msg"></div><div id="view"></div></main></div>';
 document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();boot()};
 document.getElementById('view').addEventListener('click',onClick);
}
function formHtml(){
 const f=S.form;if(!f)return '';
 return '<div class="c" style="margin-bottom:16px"><h3>'+esc(f.title)+'</h3><div class="f">'+f.fields.map(x=>'<div><label for="f_'+x.k+'">'+esc(x.l)+'</label>'+(x.t==='select'?'<select id="f_'+x.k+'">'+x.o.map(o=>'<option value="'+esc(o[0])+'"'+(String(f.v[x.k]==null?'':f.v[x.k])===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':'<input id="f_'+x.k+'" type="'+x.t+'" value="'+esc(f.v[x.k])+'"'+(x.t==='number'?' min="0"':'')+'>')+'</div>').join('')+'</div><button class="b" data-a="save">Hifadhi</button> <button class="b2" data-a="cancel">Ghairi</button></div>';
}
const sumItems=d=>(d.items||[]).reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);
const totals=d=>{const sub=sumItems(d),disc=Number(d.discount)||0,base=Math.max(sub-disc,0),vat=base*(Number(d.vat_percent)||0)/100;return{sub:sub,disc:disc,vat:vat,total:base+vat}};
const paidOf=inv=>S.docs.filter(r=>r.doc_type==='receipt'&&r.parent_id===inv.id&&r.status!=='cancelled').reduce((s,r)=>s+Number(r.amount_paid),0);
const invInfo=inv=>{const t=totals(inv).total,p=paidOf(inv);return{total:t,paid:p,bal:Math.max(t-p,0)}};
const openInv=()=>S.docs.filter(d=>d.doc_type==='invoice'&&d.status==='sent'&&invInfo(d).bal>0);
const dstat=d=>{if(d.status==='cancelled')return pill('Imeghairiwa','bd');
 if(d.doc_type==='invoice'&&d.status!=='draft'){const i=invInfo(d);if(i.bal<=0&&i.total>0)return pill('Imelipwa','ok');if(d.due_date&&d.due_date<today())return pill('Imechelewa','bd');return pill(i.paid>0?'Imelipwa kiasi':'Inasubiri','wn')}
 const m={draft:['Rasimu','wn'],sent:[d.doc_type==='quotation'?'Imetumwa':d.doc_type==='delivery_note'?'Imekabidhiwa':'Imetolewa','ok'],accepted:['Imekubaliwa','ok'],rejected:['Imekataliwa','bd']}[d.status]||[d.status,'wn'];return pill(m[0],m[1])};
const nextNo=t=>{const p=DT[t].p+'-'+new Date().getFullYear()+'-';return p+String(S.docs.filter(d=>d.doc_number.startsWith(p)).reduce((m,d)=>Math.max(m,parseInt(d.doc_number.slice(p.length))||0),0)+1).padStart(4,'0')};
const onHand=id=>S.moves.filter(m=>m.item_id===id).reduce((s,m)=>s+(m.kind==='out'?-1:1)*Number(m.qty),0);
function docList(t){const rows=S.docs.filter(d=>d.doc_type===t).sort((a,b)=>b.doc_number.localeCompare(a.doc_number)),dn=t==='delivery_note';
 return '<h2>'+DT[t].pl+'</h2><div class="bar"><button class="b" data-a="dnew" data-t="'+t+'">'+(t==='receipt'?'Risiti mpya':'Mpya')+'</button></div>'+(S.df&&S.df.t===t?dformHtml():'')+'<div class="c wrap"><table><tr><th>Namba</th><th>Mteja</th><th>Tarehe</th>'+(dn?'':'<th>Jumla</th>')+'<th>Hali</th><th></th></tr>'+rows.map(d=>'<tr><td>'+esc(d.doc_number)+'</td><td>'+esc(cname(d.client_id))+'</td><td>'+esc(d.issue_date)+'</td>'+(dn?'':'<td>'+fm(t==='receipt'?d.amount_paid:totals(d).total)+'</td>')+'<td>'+dstat(d)+'</td><td><button class="b2" data-a="dview" data-id="'+d.id+'">Fungua</button> '+(t!=='receipt'&&d.status!=='cancelled'?'<button class="b2" data-a="dedit" data-id="'+d.id+'">Hariri</button> ':'')+(d.status==='draft'||d.status==='cancelled'?'<button class="b2" data-a="ddel" data-id="'+d.id+'">Futa</button>':'')+'</td></tr>').join('')+'</table>'+(rows.length?'':'<div class="empty">Hakuna bado.</div>')+'</div>'}
function dformHtml(){const f=S.df,t=f.t,v=f.v,it=f.items||[];
 const inp=(k,l,ty,x)=>'<div><label for="d_'+k+'">'+l+'</label><input id="d_'+k+'" type="'+ty+'" value="'+esc(v[k]==null?'':v[k])+'"'+(x||'')+'></div>';
 let h='<div class="c" style="margin-bottom:16px"><h3>'+(f.id?'Hariri: ':'Mpya: ')+DT[t].n+'</h3>';
 if(t==='receipt'){const inv=S.docs.filter(d=>d.doc_type==='invoice'&&((d.status==='sent'&&invInfo(d).bal>0)||d.id===v.parent_id));
  h+='<div class="f"><div><label for="d_parent_id">Ankara inayolipwa</label><select id="d_parent_id">'+inv.map(d=>'<option value="'+d.id+'"'+(v.parent_id===d.id?' selected':'')+'>'+esc(d.doc_number+' - '+cname(d.client_id)+' (salio '+fm(invInfo(d).bal)+')')+'</option>').join('')+'</select></div>'+inp('issue_date','Tarehe','date')+inp('amount_paid','Kiasi kilicholipwa (TSh)','number',' min="0"')+'<div><label for="d_pay_method">Njia ya malipo</label><select id="d_pay_method">'+PM.map(m=>'<option'+(v.pay_method===m?' selected':'')+'>'+m+'</option>').join('')+'</select></div>'+inp('pay_ref','Kumbukumbu / namba ya muamala','text')+'</div>'}
 else{h+='<div class="f"><div><label for="d_client_id">Mteja</label><select id="d_client_id">'+S.clients.map(c=>'<option value="'+c.id+'"'+(v.client_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+inp('issue_date','Tarehe','date')+(t==='delivery_note'?'':inp('due_date',t==='invoice'?'Tarehe ya mwisho ya kulipa':'Inatumika hadi','date')+inp('vat_percent','VAT %','number',' min="0"')+inp('discount','Punguzo (TSh)','number',' min="0"'))+'</div><div class="wrap"><table><tr><th>Maelezo</th><th>Idadi</th>'+(t==='delivery_note'?'':'<th>Bei (TSh)</th>')+'<th></th></tr>'+it.map((x,i)=>'<tr><td><input data-i="'+i+'" data-k="desc" aria-label="Maelezo" value="'+esc(x.desc)+'"></td><td><input data-i="'+i+'" data-k="qty" type="number" min="0" aria-label="Idadi" value="'+esc(x.qty)+'" style="width:90px"></td>'+(t==='delivery_note'?'':'<td><input data-i="'+i+'" data-k="price" type="number" min="0" aria-label="Bei" value="'+esc(x.price)+'" style="width:140px"></td>')+'<td><button class="b2" data-a="ditem-" data-i="'+i+'" aria-label="Ondoa kipengee">Ondoa</button></td></tr>').join('')+'</table></div><p><button class="b2" data-a="ditem+">+ Ongeza kipengee</button></p><div class="f">'+inp('notes','Maelezo ya ziada','text')+'</div>'}
 return h+'<button class="b" data-a="dsave">Hifadhi</button> <button class="b2" data-a="dcancel">Ghairi</button></div>'}
function readDf(){const f=S.df;if(!f)return;['client_id','issue_date','due_date','vat_percent','discount','notes','parent_id','amount_paid','pay_method','pay_ref'].forEach(k=>{const e=document.getElementById('d_'+k);if(e)f.v[k]=e.value});[].forEach.call(document.querySelectorAll('[data-i][data-k]:not([data-g])'),e=>{f.items[+e.dataset.i][e.dataset.k]=e.value})}
function readSet(){const c={};['name','address','phone','email','tin','notes'].forEach(k=>{const e=document.getElementById('st_'+k);if(e)c[k]=e.value.trim()});S.set.company=c;[].forEach.call(document.querySelectorAll('[data-g]'),e=>{const a=S.set[e.dataset.g];if(a&&a[+e.dataset.i])a[+e.dataset.i][e.dataset.k]=e.value.trim()})}
function sheet(d){const c=S.set.company||{},cl=S.clients.find(x=>x.id===d.client_id)||{},t=d.doc_type,tt=totals(d),inv=S.docs.find(x=>x.id===d.parent_id);
 let h='<div class="sheet"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><b style="font-size:20px">'+esc(c.name||'EAGLE EMERGENCY SECURITY (T) LIMITED')+'</b><br>'+esc(c.address||'')+'<br>'+esc([c.phone,c.email].filter(Boolean).join(' | '))+(c.tin?'<br>TIN: '+esc(c.tin):'')+'</div><div style="text-align:right"><b style="font-size:24px;letter-spacing:1px">'+DT[t].n.toUpperCase()+'</b><br>Namba: '+esc(d.doc_number)+'<br>Tarehe: '+esc(d.issue_date)+(d.due_date?'<br>'+(t==='invoice'?'Mwisho wa kulipa: ':'Inatumika hadi: ')+esc(d.due_date):'')+(d.status==='cancelled'?'<br><b>IMEGHAIRIWA</b>':'')+'</div></div><h4>'+(t==='receipt'?'Imepokelewa kutoka kwa':t==='delivery_note'?'Imekabidhiwa kwa':'Kwa')+'</h4><b>'+esc(cl.name||'')+'</b>';

 if(f.kind==='g'){const n=val('full_name');if(n.length<2){note('Andika jina la mlinzi.');return route()}
  const row={full_name:n,phone:val('phone')||null,client_id:val('client_id')||null,status:val('status')};
  const r=f.id?await sb.from('guards').update(row).eq('id',f.id):await sb.from('guards').insert(Object.assign({code:nextCode()},row));err=r.error}
 if(f.kind==='c'){const n=val('name');if(n.length<2){note('Andika jina la mteja.');return route()}
  const k={guards_required:Number(val('guards_required'))||0,monthly_fee:Number(val('monthly_fee'))||0,end_date:val('end_date')||null};
  let cid=f.id;
  if(cid){const r=await sb.from('clients').update({name:n}).eq('id',cid);err=r.error}
  else{const r=await sb.from('clients').insert({name:n}).select().single();err=r.error;if(!err)cid=r.data.id}
  if(!err){const r=await sb.from('contracts').upsert(Object.assign({client_id:cid},k),{onConflict:'client_id'});err=r.error}}
 if(f.kind==='si'){const n=val('name');if(n.length<2){note('Andika jina la bidhaa.');return route()}const row={name:n,unit:val('unit')||'pcs',reorder_level:Number(val('reorder_level'))||0};const r=f.id?await sb.from('stock_items').update(row).eq('id',f.id):await sb.from('stock_items').insert(row);err=r.error}
 if(f.kind==='sm'){const q=Number(val('qty')),k=val('kind'),it=val('item_id');if(!it||!q||(k!=='adjust'&&q<0)){note('Weka bidhaa na idadi sahihi.');return route()}if(k==='out'&&q>onHand(it)){note('Stoo haitoshi. Kilichopo: '+onHand(it));return route()}const r=await sb.from('stock_moves').insert({item_id:it,kind:k,qty:q,move_date:val('move_date')||today(),note:val('note')||null});err=r.error}
 if(err){note('Imeshindwa kuhifadhi: '+err.message);return route()}
 S.form=null;try{await loadAll()}catch(x){note(x.message)}
 if(!S.msg)note('Imehifadhiwa.','o');route();
}
async function dsave(){readDf();const f=S.df,t=f.t,v=f.v;let row;
 if(t==='receipt'){const inv=S.docs.find(d=>d.id===v.parent_id);if(!inv){note('Chagua ankara.');return route()}const am=Number(v.amount_paid);if(!(am>0)){note('Weka kiasi.');return route()}const old=f.id?Number((S.docs.find(x=>x.id===f.id)||{}).amount_paid)||0:0,bal=invInfo(inv).bal+old;if(am>bal+0.001){note('Kiasi kinazidi salio ('+fm(bal)+').');return route()}
  row={client_id:inv.client_id,parent_id:inv.id,issue_date:v.issue_date||today(),amount_paid:am,pay_method:v.pay_method,pay_ref:v.pay_ref||null}}
 else{const items=f.items.filter(x=>String(x.desc).trim()&&Number(x.qty)>0).map(x=>({desc:String(x.desc).trim(),qty:Number(x.qty),price:Number(x.price)||0}));if(!v.client_id||!items.length){note('Chagua mteja na weka kipengee angalau kimoja.');return route()}
  row={client_id:v.client_id,issue_date:v.issue_date||today(),due_date:v.due_date||null,items:items,vat_percent:Number(v.vat_percent)||0,discount:Number(v.discount)||0,notes:v.notes||null}}
 const r=f.id?await sb.from('documents').update(row).eq('id',f.id):await sb.from('documents').insert(Object.assign({doc_type:t,doc_number:nextNo(t),status:t==='receipt'?'sent':'draft'},row));
 if(r.error){note('Imeshindwa kuhifadhi: '+r.error.message);return route()}
 S.df=null;try{await loadAll()}catch(x){note(x.message)}if(!S.msg)note('Imehifadhiwa.','o');route()}
async function convert(id,to){const d=S.docs.find(x=>x.id===id),inv=to==='invoice';
 const row={doc_type:to,doc_number:nextNo(to),client_id:d.client_id,parent_id:d.id,issue_date:today(),due_date:inv?addDays(today(),30):null,items:to==='delivery_note'?(d.items||[]).map(i=>({desc:i.desc,qty:i.qty,price:0})):d.items,vat_percent:inv?d.vat_percent:0,discount:inv?d.discount:0,status:'draft'};
 const r=await sb.from('documents').insert(row).select().single();if(r.error)throw r.error;
 if(inv&&d.doc_type==='quotation'){const u=await sb.from('documents').update({status:'accepted'}).eq('id',id);if(u.error)throw u.error}
 await loadAll();S.docv=r.data.id;note('Imetengenezwa: '+row.doc_number,'o')}
addEventListener('hashchange',()=>{S.docv=null;if(S.uid&&document.getElementById('view'))route()});
boot();
})();
</script>
